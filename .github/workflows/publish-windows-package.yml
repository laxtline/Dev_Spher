name: Publish Windows release and package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Restore the pinned Windows rendering runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content -LiteralPath 'App/windows/desktop-runtime.json' -Raw | ConvertFrom-Json
          $cab = Join-Path $env:RUNNER_TEMP 'webview2-runtime.cab'
          $unpacked = Join-Path $env:RUNNER_TEMP 'dev-spher-webview2'
          New-Item -ItemType Directory -Path $unpacked | Out-Null
          curl.exe --fail --location --retry 3 --output $cab $config.url
          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed.' }
          if ((Get-FileHash -LiteralPath $cab).Hash -ne $config.sha256) { throw 'Runtime checksum mismatch.' }
          expand.exe $cab '-F:*' $unpacked
          if ($LASTEXITCODE -ne 0) { throw 'Runtime extraction failed.' }
          $exe = @(Get-ChildItem -LiteralPath $unpacked -Recurse -File -Filter 'msedgewebview2.exe')
          if ($exe.Count -ne 1) { throw 'Expected one WebView2 runtime.' }
          Copy-Item -LiteralPath $exe[0].Directory.FullName -Destination 'App/desktop-runtime' -Recurse
      - name: Build and verify distribution archives
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python -B -c "from Publish.release_build import build; build()"
          python -B Website/package_offline.py
          $setup = Get-Item -LiteralPath 'Installer/Pratice-Code-Setup.exe'
          $offline = Get-Item -LiteralPath 'Website/downloads/Pratice-Code-Offline.zip'
          $sums = foreach ($file in @($setup, $offline)) {
              $digest = (Get-FileHash -LiteralPath $file.FullName).Hash.ToLowerInvariant()
              "$digest  $($file.Name)"
          }
          $sums | Set-Content -LiteralPath 'SHA256SUMS.txt' -Encoding ascii
      - name: Publish v1.4.0
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view v1.4.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { exit 0 }
          gh release create v1.4.0 --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'Pratice Code 1.4.0' --notes-file Publish/release-notes.md Installer/Pratice-Code-Setup.exe Website/downloads/Pratice-Code-Offline.zip SHA256SUMS.txt
          exit $LASTEXITCODE

  package:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify installer from the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.4.0 --repo "$GITHUB_REPOSITORY" --pattern Pratice-Code-Setup.exe --pattern SHA256SUMS.txt
          tr -d '\r' < SHA256SUMS.txt | awk '$2 == "Pratice-Code-Setup.exe"' | sha256sum --check -
      - name: Publish installer to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          mvn --batch-mode --no-transfer-progress
          org.apache.maven.plugins:maven-deploy-plugin:3.2.0:deploy-file
          -Dfile=Pratice-Code-Setup.exe
          -DpomFile=packages/pom.xml
          -Dpackaging=exe
          -DrepositoryId=github
          -Durl="https://maven.pkg.github.com/${GITHUB_REPOSITORY,,}"
          -DretryFailedDeploymentCount=2
